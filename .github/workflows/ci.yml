name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release metadata
        run: |
          set -euo pipefail
          test "$(jq -er .pluginVersion compatibility.json)" = "$(cat VERSION)"
          test "$(jq -er .pluginAbiRelease compatibility.json)" = plugin-abi-release.json
          grep -Eq "componentVersion[[:space:]]*= \"$(cat VERSION)\"" node.go
          jq -e '
            (.abi_id | test("^abi-[0-9a-f]{64}$")) and
            (.lock_digest | test("^sha256:[0-9a-f]{64}$")) and
            (.packaging_revision | test("^[0-9a-f]{40}$")) and
            (.sdk | test("^ghcr\\.io/killbus/rulego-plugin-sdk@sha256:[0-9a-f]{64}$")) and
            (.runtime | test("^ghcr\\.io/killbus/rulego-server@sha256:[0-9a-f]{64}$"))
          ' plugin-abi-release.json
          jq -e . examples/youtube-hls/chain.json testdata/*.json >/dev/null
      - run: go mod download
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Read immutable Plugin ABI release
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          jq -e '
            (.abi_id | test("^abi-[0-9a-f]{64}$")) and
            (.lock_digest | test("^sha256:[0-9a-f]{64}$")) and
            (.sdk | test("@sha256:[0-9a-f]{64}$")) and
            (.runtime | test("@sha256:[0-9a-f]{64}$"))
          ' plugin/plugin-abi-release.json
          {
            echo "SDK_REF=$(jq -er .sdk plugin/plugin-abi-release.json)"
            echo "RUNTIME_REF=$(jq -er .runtime plugin/plugin-abi-release.json)"
            echo "ABI_ID=$(jq -er .abi_id plugin/plugin-abi-release.json)"
            echo "LOCK_DIGEST=$(jq -er .lock_digest plugin/plugin-abi-release.json)"
            echo "PLUGIN_ARTIFACT=indexed-vod-rulego-v$(cat plugin/VERSION)-linux-${{ matrix.arch }}.so"
          } >> "$GITHUB_ENV"
      - name: Pull pinned SDK with bounded retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if docker pull --platform "linux/${{ matrix.arch }}" "$SDK_REF"; then break; fi
            test "$attempt" -lt 4
            sleep $((2 ** attempt))
          done
      - name: Build versioned plugin with pinned SDK
        run: |
          set -euo pipefail
          install -d -m 0777 plugin/dist
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            -v "$GITHUB_WORKSPACE/plugin:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/plugin/dist:/output" \
            "$SDK_REF" . "/output/$PLUGIN_ARTIFACT"
      - name: Verify SDK sidecars
        working-directory: plugin/dist
        run: |
          set -euo pipefail
          sha256sum --check "$PLUGIN_ARTIFACT.sha256"
          plugin_sha256=$(sha256sum "$PLUGIN_ARTIFACT" | awk '{print $1}')
          jq -e --arg abi "$ABI_ID" --arg lock "$LOCK_DIGEST" \
            --arg platform "linux/${{ matrix.arch }}" --arg sha "$plugin_sha256" '
              .abi_id == $abi and .lock_digest == $lock and
              .platform == $platform and .plugin_sha256 == $sha
            ' "$PLUGIN_ARTIFACT.abi.json"
      - name: Pull pinned runtime with bounded retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if docker pull --platform "linux/${{ matrix.arch }}" "$RUNTIME_REF"; then break; fi
            test "$attempt" -lt 4
            sleep $((2 ** attempt))
          done
          test "$(docker image inspect --format '{{ index .Config.Labels "io.rulego.server.release" }}' "$RUNTIME_REF")" = "$(jq -er .rulegoRelease plugin/compatibility.json)"
      - name: Smoke-load owner and ref borrower
        run: |
          set -euo pipefail
          mkdir -p plugin/tmp/data/plugins plugin/tmp/data/indexed-vod
          cp "plugin/dist/$PLUGIN_ARTIFACT" plugin/tmp/data/plugins/
          chmod -R a+rwX plugin/tmp/data
          container="indexed-vod-smoke-${{ matrix.arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --detach --name "$container" \
            --platform "linux/${{ matrix.arch }}" -p 127.0.0.1:9090:9090 \
            -v "$GITHUB_WORKSPACE/plugin/tmp/data:/app/data" \
            -v "$GITHUB_WORKSPACE/plugin/testdata/smoke-node-pool.json:/app/node_pool.json:ro" \
            "$RUNTIME_REF"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:9090/api/v1/components >plugin/tmp/components.json; then break; fi
            if test "$(docker inspect --format='{{.State.Running}}' "$container")" != true; then
              docker logs "$container"
              exit 1
            fi
            sleep 0.2
          done
          test -s plugin/tmp/components.json || { docker logs "$container"; exit 1; }
          jq -e '.nodes | any(.type == "indexedVod")' plugin/tmp/components.json
          jq -e '.builtins.nodePool.indexedVod | any(.id == "indexed-vod")' plugin/tmp/components.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @plugin/testdata/smoke-borrower-chain.json \
            http://127.0.0.1:9090/api/v1/rules/indexed-vod-smoke >/dev/null
          curl --fail --silent http://127.0.0.1:9090/api/v1/rules/indexed-vod-smoke \
            | jq -e '.metadata.nodes | any(.type == "indexedVod" and .configuration.root == "ref://indexed-vod")'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux-${{ matrix.arch }}
          path: |
            plugin/dist/*.so
            plugin/dist/*.sha256
            plugin/dist/*.abi.json
          if-no-files-found: error

  e2e-hls-seek:
    name: Hermetic HLS seek
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: plugin-linux-amd64
          path: dist
      - name: Download and verify peer plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/peers
          download_release() {
            repo="$1"
            tag="$2"
            artifact="$3"
            for attempt in 1 2 3 4; do
              if gh release download "$tag" --repo "$repo" --dir tmp/peers --clobber \
                --pattern "$artifact" --pattern "$artifact.sha256" --pattern "$artifact.abi.json"; then
                return
              fi
              test "$attempt" -lt 4
              sleep $((2 ** attempt))
            done
          }
          ffmpeg_artifact=ffmpeg-over-ip-rulego-v0.5.1-linux-amd64.so
          origin_artifact=resource-origin-rulego-v0.1.1-linux-amd64.so
          download_release killbus/rulego-ffmpeg-over-ip v0.5.1 "$ffmpeg_artifact"
          download_release killbus/rulego-resource-origin v0.1.1 "$origin_artifact"
          (
            cd tmp/peers
            sha256sum --check "$ffmpeg_artifact.sha256"
            sha256sum --check "$origin_artifact.sha256"
          )
          abi_id=$(jq -er .abi_id plugin-abi-release.json)
          lock_digest=$(jq -er .lock_digest plugin-abi-release.json)
          for artifact in "$ffmpeg_artifact" "$origin_artifact"; do
            artifact_sha256=$(sha256sum "tmp/peers/$artifact" | awk '{print $1}')
            jq -e --arg abi "$abi_id" --arg lock "$lock_digest" --arg sha "$artifact_sha256" '
              .abi_id == $abi and .lock_digest == $lock and
              .platform == "linux/amd64" and .plugin_sha256 == $sha
            ' "tmp/peers/$artifact.abi.json"
          done
          {
            echo "INDEXED_PLUGIN=$GITHUB_WORKSPACE/dist/indexed-vod-rulego-v$(cat VERSION)-linux-amd64.so"
            echo "FFMPEG_PLUGIN=$GITHUB_WORKSPACE/tmp/peers/$ffmpeg_artifact"
            echo "ORIGIN_PLUGIN=$GITHUB_WORKSPACE/tmp/peers/$origin_artifact"
          } >> "$GITHUB_ENV"
      - name: Run real indexed HLS path
        run: tests/e2e-hls-seek.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-hls-seek-debug
          path: tmp/e2e-hls.*/
          if-no-files-found: ignore

  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect release metadata
        run: |
          mkdir dist
          cp LICENSE README.md compatibility.json plugin-abi-release.json dist/
          cp examples/youtube-hls/chain.json dist/example-chain.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: dist/
